name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            multiplayer/package-lock.json
            web/package-lock.json
            server/package-lock.json

      - name: Install durable multiplayer dependencies
        run: npm ci --prefix multiplayer

      - name: Test durable multiplayer in the Worker runtime
        run: npm test --prefix multiplayer

      - name: Typecheck durable multiplayer
        run: npm run typecheck --prefix multiplayer

      - name: Validate Worker deployment bundle without deploying
        run: npx --prefix multiplayer wrangler deploy --dry-run --config multiplayer/wrangler.jsonc --env=""

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run web unit and browser tests
        run: npm test --prefix web

      - name: Build web application
        run: npm run build --prefix web

      - name: Run legacy relay end-to-end checks
        run: node server/e2e-multiplayer.mjs
